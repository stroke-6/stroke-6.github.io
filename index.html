<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stroke6's Empty Home</title>
  <link rel="icon" type="image/x-icon" href="https://stroke-6.github.io/AO3/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-soft: #6b6b6b;
      --border: #ececec;

      --accent: #f87171;
      --accent-soft: #fee2e2;

      --color-red: #b91c1c;
      --color-red-bg: #fef2f2;
      --color-blue: #2563eb;
      --color-blue-bg: #eff6ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
      display: grid;
      grid-template-columns: minmax(260px, 360px) 1fr;
      gap: 4rem;
      align-items: start;
    }

    .intro {
      position: sticky;
      top: 3rem;
      text-align: left;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      display: block;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.75rem;
      line-height: 1.05;
    }

    h1 .highlight {
      background: linear-gradient(180deg, transparent 60%, var(--accent) 60%, var(--accent) 92%, transparent 92%);
      padding: 0 0.15em;
    }

    .bio {
      font-size: 1.05rem;
      color: var(--text);
      margin: 0;
    }

    .bio em {
      background: var(--accent-soft);
      font-style: normal;
      padding: 0 0.25em;
      border-radius: 3px;
    }

    .inline-link {
      color: var(--color-red);
      text-decoration: none;
      font-weight: 600;
      background: linear-gradient(180deg, transparent 70%, var(--accent-soft) 70%);
      padding: 0 0.15em;
      border-radius: 2px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .inline-link:hover {
      background: var(--accent);
      color: var(--text);
    }

    .content { min-width: 0; }

    .section { margin-bottom: 2.75rem; }
    .section:last-child { margin-bottom: 0; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .section-label h2 {
      font-family: "Merriweather", Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .section-label .line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .cards {
      display: grid;
      gap: 0.6rem;
    }

    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 6px solid var(--card-accent, var(--text-soft));
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.07);
      background: var(--card-bg, var(--surface));
    }

    .card-title {
      font-family: "Merriweather", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--card-accent, var(--text));
      margin-bottom: 0.35rem;
      letter-spacing: -0.005em;
    }

    .card-desc {
      color: var(--text-soft);
      font-size: 0.93rem;
      line-height: 1.5;
    }

    .card-desc em { font-style: italic; color: var(--text); }

    .card.red  { --card-accent: var(--color-red);  --card-bg: var(--color-red-bg); }
    .card.blue { --card-accent: var(--color-blue); --card-bg: var(--color-blue-bg); }

    code {
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.85em;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        gap: 2.5rem;
        padding: 2.5rem 1.25rem 4rem;
      }
      .intro {
        position: static;
        text-align: center;
      }
      .avatar { margin: 0 auto 1.25rem; }
      h1 { font-size: 2.25rem; text-align: center; }
      .bio { text-align: center; max-width: 520px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <main>
    <aside class="intro">
      <img class="avatar" src="https://stroke-6.github.io/AO3/images/original.jpg" alt="stroke">
      <h1><span class="highlight">Resources</span></h1>
      <p class="bio">
        Hi, stroke here. You're probably looking for <a class="inline-link" href="https://stroke-6.github.io/AO3/">this</a>.
      </p>
    </aside>

    <section class="content">
      <div class="section">
        <div class="section-label">
          <h2>Otherwise</h2>
          <div class="line"></div>
        </div>
        <div class="cards">
          <a class="card red" href="https://archiveofourown.org/users/stroke6">
            <div class="card-title">Archive of Our Own (AO3) Profile</div>
            <div class="card-desc">Illustrated.</div>
          </a>
          <a class="card blue" href="https://www.fanfiction.net/u/15463812/stroke6">
            <div class="card-title">FanFiction.Net Profile</div>
            <div class="card-desc">Not exactly illustrated by default, but we can make it work — mostly.</div>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
